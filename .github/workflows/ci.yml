name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Full gate across architectures. The aarch64 leg catches platform-dependent
  # type issues (e.g. c_char signedness) that x86_64-only CI would miss.
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libgbm-dev libegl1-mesa-dev libdrm-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  # Build + test across distros to catch package-name / library differences.
  # fmt + clippy stay in the `build` job only, to avoid toolchain-version skew.
  distros:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:stable
          - distro: fedora
            image: fedora:latest
          - distro: arch
            image: archlinux:latest
          - distro: opensuse
            image: opensuse/tumbleweed
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      # Pin rustup/cargo to a fixed location instead of $HOME: in a container job
      # GitHub sets HOME=/github/home, so a hardcoded /root path would be wrong.
      # Set PATH explicitly too — writing to $GITHUB_PATH inside a container can
      # drop the container's standard dirs (breaking the step shell).
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install system dependencies (Debian)
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config \
            libwayland-dev libgbm-dev libegl1-mesa-dev libdrm-dev

      - name: Install system dependencies (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y curl gcc pkgconf-pkg-config \
            wayland-devel mesa-libgbm-devel mesa-libEGL-devel libdrm-devel

      - name: Install system dependencies (Arch)
        if: matrix.distro == 'arch'
        run: |
          pacman -Syu --noconfirm curl gcc pkgconf \
            wayland wayland-protocols mesa libdrm

      - name: Install system dependencies (openSUSE)
        if: matrix.distro == 'opensuse'
        run: |
          # The opensuse/tumbleweed image ships pre-cached repo metadata that
          # goes stale: its baked-in repomd.xml references snapshot files (e.g.
          # appdata.xml.gz) that have since been rotated off the mirrors, so a
          # plain refresh hangs fetching files that no longer exist (Curl 28).
          # Clear the cached metadata first to force a fresh fetch of the
          # current snapshot. See openSUSE/docker-containers#57.
          zypper clean --all
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper -n install curl gcc pkg-config \
            wayland-devel libgbm-devel Mesa-libEGL-devel libdrm-devel

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --no-modify-path
          # rustup installs to $CARGO_HOME/bin (/usr/local/cargo/bin), already on PATH above

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate PKGBUILD syntax
        run: bash -n aur/PKGBUILD

      - name: Ensure source URL has no stray v-prefix
        run: |
          if grep -q 'refs/tags/v\$pkgver' aur/PKGBUILD; then
            echo "::error::aur/PKGBUILD source URL must use \$pkgver, not v\$pkgver (git tags have no v prefix)"
            exit 1
          fi

  # Build the AUR package from this checkout with makepkg in a clean Arch container.
  # makepkg -s resolves depends/makedepends through pacman, so a dependency that no
  # official repo provides (e.g. 'libgbm' instead of 'mesa') fails here, not on the AUR.
  aur-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install makepkg prerequisites
        run: pacman -Syu --noconfirm --needed base-devel git sudo

      - name: Checkout
        uses: actions/checkout@v6

      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Check .SRCINFO matches PKGBUILD
        run: |
          chown -R builder .
          cd aur
          sudo -u builder makepkg --printsrcinfo > /tmp/SRCINFO
          diff -u .SRCINFO /tmp/SRCINFO

      - name: Build and install with makepkg
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' aur/PKGBUILD)
          mkdir /tmp/pkg
          cp aur/PKGBUILD /tmp/pkg/
          # Use this checkout as the source tarball (makepkg skips downloading files already present)
          git archive --prefix="sway-mirror-$pkgver/" -o "/tmp/pkg/sway-mirror-$pkgver.tar.gz" HEAD
          chown -R builder /tmp/pkg
          cd /tmp/pkg
          sudo -u builder makepkg --syncdeps --install --noconfirm

      - name: Verify installed package
        run: |
          pacman -Qi sway-mirror
          ! ldd /usr/bin/sway-mirror | grep 'not found'
          sway-mirror --help

  # Build the .deb exactly as the release does, then install it in clean containers.
  deb-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper libwayland-dev libgbm-dev libegl1-mesa-dev libdrm-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build .deb package
        run: |
          dpkg-buildpackage -us -uc -b -d
          mkdir dist
          mv ../sway-mirror_*.deb dist/

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: dist/

  deb-install:
    needs: deb-package
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:stable', 'ubuntu:latest']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Download .deb
        uses: actions/download-artifact@v8
        with:
          name: deb-package

      - name: Install into clean system
        run: |
          apt-get update
          apt-get install -y ./sway-mirror_*.deb

      - name: Verify installed package
        run: |
          dpkg -s sway-mirror
          ! ldd /usr/bin/sway-mirror | grep 'not found'
          sway-mirror --help
