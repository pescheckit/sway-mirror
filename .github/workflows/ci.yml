name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Full gate across architectures. The aarch64 leg catches platform-dependent
  # type issues (e.g. c_char signedness) that x86_64-only CI would miss.
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libgbm-dev libegl1-mesa-dev libdrm-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  # Build + test across distros to catch package-name / library differences.
  # fmt + clippy stay in the `build` job only, to avoid toolchain-version skew.
  distros:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:stable
          - distro: fedora
            image: fedora:latest
          - distro: arch
            image: archlinux:latest
          - distro: opensuse
            image: opensuse/tumbleweed
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      # Set PATH explicitly: writing to $GITHUB_PATH inside a container can drop
      # the container's standard dirs (breaking the step shell). Include both the
      # standard dirs and cargo's bin (containers run as root, so HOME=/root).
      PATH: /root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install system dependencies (Debian)
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config \
            libwayland-dev libgbm-dev libegl1-mesa-dev libdrm-dev

      - name: Install system dependencies (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y curl gcc pkgconf-pkg-config \
            wayland-devel mesa-libgbm-devel mesa-libEGL-devel libdrm-devel

      - name: Install system dependencies (Arch)
        if: matrix.distro == 'arch'
        run: |
          pacman -Syu --noconfirm curl gcc pkgconf \
            wayland wayland-protocols mesa libdrm

      - name: Install system dependencies (openSUSE)
        if: matrix.distro == 'opensuse'
        run: |
          zypper -n install curl gcc pkg-config \
            wayland-devel libgbm-devel Mesa-libEGL-devel libdrm-devel

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          # cargo is on PATH via the job-level env above (/root/.cargo/bin)

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PKGBUILD syntax
        run: bash -n aur/PKGBUILD
