name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re)sync to AUR, e.g. 1.0.2'
        required: true
      pkgrel:
        description: 'Package release number (bump when re-syncing an existing version)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  build-linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper libwayland-dev libgbm-dev libegl1-mesa-dev libdrm-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        run: |
          VERSION="${{ env.VERSION }}"
          # Cargo manifest (Cargo.lock's own entry is refreshed by the build step below)
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          # Debian changelog: prepend a real release entry, keep history
          DATE=$(date -R)
          {
            printf '%s\n\n  * Release %s\n\n -- Bram <bram+sway@pescheck.io>  %s\n\n' \
              "sway-mirror ($VERSION-1) unstable; urgency=medium" "$VERSION" "$DATE"
            cat debian/changelog
          } > debian/changelog.new
          mv debian/changelog.new debian/changelog
          # AUR source-of-truth files (the update-aur job copies these verbatim)
          sed -i "s/^pkgver=.*/pkgver=$VERSION/;s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
          sed -i "s/^\tpkgver = .*/\tpkgver = $VERSION/;s/^\tpkgrel = .*/\tpkgrel = 1/" aur/.SRCINFO
          sed -i "s|sway-mirror-.*|sway-mirror-$VERSION.tar.gz::https://github.com/pescheckit/sway-mirror/archive/refs/tags/$VERSION.tar.gz|" aur/.SRCINFO

      - name: Build release binary
        run: cargo build --release

      - name: Commit version bump to main
        run: |
          VERSION="${{ env.VERSION }}"
          git config user.name "Pescheckit Bot"
          git config user.email "bram+sway@pescheck.io"
          git add Cargo.toml Cargo.lock debian/changelog aur/PKGBUILD aur/.SRCINFO
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore(release): set version to $VERSION"
            git push origin HEAD:main \
              || echo "::warning::Could not fast-forward main; version bump not pushed (main may have advanced past the tag)"
          fi

      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b -d

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          mv ../sway-mirror_${{ env.VERSION }}-1_amd64.deb dist/sway-mirror_${{ env.VERSION }}_amd64.deb
          cp target/release/sway-mirror dist/sway-mirror-linux-x86_64
          cd dist
          sha256sum sway-mirror_${{ env.VERSION }}_amd64.deb > sway-mirror_${{ env.VERSION }}_amd64.deb.sha256
          sha256sum sway-mirror-linux-x86_64 > sway-mirror-linux-x86_64.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: dist/

  create-release:
    if: github.event_name == 'push'
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-artifacts
          path: ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.VERSION }}
          files: |
            dist/*.deb
            dist/*.deb.sha256
            dist/sway-mirror-linux-x86_64
            dist/sway-mirror-linux-x86_64.sha256
          generate_release_notes: true
          body: |
            ## Installation

            ### Debian/Ubuntu
            ```bash
            wget https://github.com/pescheckit/sway-mirror/releases/download/${{ env.VERSION }}/sway-mirror_${{ env.VERSION }}_amd64.deb
            wget https://github.com/pescheckit/sway-mirror/releases/download/${{ env.VERSION }}/sway-mirror_${{ env.VERSION }}_amd64.deb.sha256
            sha256sum -c sway-mirror_${{ env.VERSION }}_amd64.deb.sha256
            sudo dpkg -i sway-mirror_${{ env.VERSION }}_amd64.deb
            sudo apt-get install -f
            ```

            ### Arch Linux (AUR)
            ```bash
            yay -S sway-mirror
            ```

            ### Binary Download
            ```bash
            wget https://github.com/pescheckit/sway-mirror/releases/download/${{ env.VERSION }}/sway-mirror-linux-x86_64
            wget https://github.com/pescheckit/sway-mirror/releases/download/${{ env.VERSION }}/sway-mirror-linux-x86_64.sha256
            sha256sum -c sway-mirror-linux-x86_64.sha256
            chmod +x sway-mirror-linux-x86_64
            sudo mv sway-mirror-linux-x86_64 /usr/local/bin/sway-mirror
            ```

            ### Build from source
            ```bash
            cargo install --git https://github.com/pescheckit/sway-mirror
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-aur:
    needs: create-release
    # Run after a successful release (push), or standalone via workflow_dispatch to re-sync an
    # existing version (e.g. a packaging-only fix at a higher pkgrel) entirely from CI/CD.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.create-release.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Check if AUR secret exists
        id: check-secret
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "$AUR_SSH_KEY" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "AUR_SSH_KEY not set, skipping AUR update"
          fi

      - name: Checkout
        if: steps.check-secret.outputs.exists == 'true'
        uses: actions/checkout@v6
        with:
          # main carries the version bump committed by build-linux (push) and is current on dispatch
          ref: main

      - name: Resolve version
        if: steps.check-secret.outputs.exists == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            PKGREL="${{ github.event.inputs.pkgrel }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
            PKGREL="1"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PKGREL=$PKGREL" >> $GITHUB_ENV

      - name: Update AUR package
        if: steps.check-secret.outputs.exists == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          printf '%s\n' "Host aur.archlinux.org" "  IdentityFile ~/.ssh/aur" "  User aur" >> ~/.ssh/config
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          # Clone AUR repo and overwrite with the repo's source-of-truth packaging files
          git clone ssh://aur@aur.archlinux.org/sway-mirror.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo

          VERSION="${{ env.VERSION }}"
          PKGREL="${{ env.PKGREL }}"
          # Re-stamp version/pkgrel and guarantee a v-free source URL so the live AUR can't drift
          sed -i "s/^pkgver=.*/pkgver=$VERSION/;s/^pkgrel=.*/pkgrel=$PKGREL/" PKGBUILD
          sed -i "s|refs/tags/v\$pkgver|refs/tags/\$pkgver|" PKGBUILD
          sed -i "s/^\tpkgver = .*/\tpkgver = $VERSION/;s/^\tpkgrel = .*/\tpkgrel = $PKGREL/" .SRCINFO
          sed -i "s|sway-mirror-.*|sway-mirror-$VERSION.tar.gz::https://github.com/pescheckit/sway-mirror/archive/refs/tags/$VERSION.tar.gz|" .SRCINFO

          # Commit and push
          git config user.name "Pescheckit Bot"
          git config user.email "bram+sway@pescheck.io"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to $VERSION-$PKGREL" || echo "No changes to commit"
          git push || echo "Push failed - may need to set up AUR package first"
